<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prescrever - Protocolos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./prescricoes.css?v=20260228-20" />
</head>
<body>
  <div class="page-overlay">
    <div class="app-modal">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span class="sidebar-icon" aria-hidden="true">▣</span>
          <h1>Sistemas</h1>
        </div>

        <nav class="system-filters" aria-label="Filtros principais">
          <button class="filter-btn active" data-filter="favorites" type="button">★ Favoritos</button>
          <button class="filter-btn" data-filter="all" type="button">Todos</button>
        </nav>

        <div id="areaFilters" class="area-filters" aria-label="Áreas"></div>
      </aside>

      <section class="content-panel">
        <header class="panel-head">
          <div>
            <h2>Protocolos e Prescrições Rápidas</h2>
            <p>Selecione ou crie um protocolo para inserir</p>
          </div>
          <div class="panel-head-actions">
            <a class="head-btn" href="./editor/?v=20260228-20">Abrir Editor</a>
          </div>
        </header>

        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Buscar doença, sintoma ou protocolo..." />
        </div>

        <section id="loadingState" class="state-panel">
          <h3>Carregando protocolos...</h3>
          <p>Lendo os arquivos JSON em <code>/data</code>.</p>
        </section>

        <section id="errorState" class="state-panel error" hidden></section>

        <section id="emptyState" class="state-panel" hidden>
          <div class="empty-icon" aria-hidden="true">▭</div>
          <h3>Nenhum protocolo encontrado</h3>
          <p>Tente ajustar a busca ou criar um novo protocolo.</p>
          <a class="cta-btn" href="./editor/?v=20260228-20">+ Criar Novo Protocolo</a>
        </section>

        <section id="protocolList" class="protocol-list" hidden></section>
      </section>
    </div>
  </div>

  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        })
        .catch(function () {});
    })();
  </script>
  <script src="./prescricoes.js?v=20260228-20" defer></script>
</body>
</html>
