<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UsoJaleco | Diretrizes e Protocolos</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/arthurambrosi/usojaleco/0204905b333f11d1eec3c7c6667d17dbfb457774/Design%20sem%20nome%20(28).png">
  <script defer src="/analytics-config.js"></script>
  <script defer src="/analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff;
      --surface:#ffffff;
      --surface2:#f8fafc;
      --text:#0f172a;
      --muted:#6b7280;
      --line:#e9eef5;
      --accent:#f97316;
      --shadow:0 10px 22px rgba(17,24,39,.08);
      --shadow2:0 14px 28px rgba(17,24,39,.10);
      --rBig:24px;
      --rMid:18px;
      --rSm:14px;
      --containerMax:1340px;
      --containerPad:24px;
      --t:.18s ease;
    }

    *{ box-sizing:border-box; }
    html,body{ min-height:100%; }

    body{
      margin:0;
      font-family: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 12% 10%, rgba(249,115,22,.10), transparent 60%),
        radial-gradient(1000px 580px at 85% 18%, rgba(15,23,42,.06), transparent 62%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
      background-attachment: fixed, fixed, fixed;
    }

    a{ color:inherit; text-decoration:none; }
    button,input{ font:inherit; }

    .topbarWrap{
      background:#fff;
      box-shadow:0 10px 22px rgba(17,24,39,.10);
      position:sticky;
      top:0;
      z-index:40;
    }

    .topbar{
      max-width:var(--containerMax);
      margin:0 auto;
      padding:16px var(--containerPad);
      display:flex;
      align-items:center;
      gap:16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:190px;
      user-select:none;
    }

    .brand img{
      height:28px;
      width:auto;
      display:block;
      user-select:none;
      pointer-events:none;
      -webkit-user-drag:none;
    }

    .brandName{
      display:flex;
      align-items:baseline;
      gap:0;
      font-family: Outfit, Manrope, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size:18px;
      font-weight:400;
      letter-spacing:-.01em;
      color:#475569;
      user-select:none;
      pointer-events:none;
    }

    .brandName b{
      font-weight:800;
      color:#334155;
    }

    .headRight{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .headBtn{
      height:38px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid #e7ebf2;
      background:#fff;
      color:#334155;
      font-weight:900;
      cursor:pointer;
      transition:background var(--t), filter var(--t), transform var(--t);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      line-height:1;
      white-space:nowrap;
    }

    .headBtn:hover{
      background:#f8fafc;
      transform:translateY(-1px);
    }

    .headBtnPrimary{
      background:var(--accent);
      border-color:var(--accent);
      color:#fff;
    }

    .headBtnPrimary:hover{
      background:var(--accent);
      border-color:var(--accent);
      filter:brightness(.94);
    }

    main{
      max-width:var(--containerMax);
      margin:0 auto;
      padding:16px var(--containerPad) 42px;
    }

    .hero{
      border:1px solid var(--line);
      border-radius:var(--rBig);
      background:var(--surface);
      box-shadow:var(--shadow);
      padding:20px;
      margin-bottom:14px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      border:1px solid rgba(249,115,22,.28);
      background:rgba(249,115,22,.10);
      color:#c2410c;
      padding:5px 11px;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:10px;
    }

    h1{
      margin:0 0 8px;
      font-size:34px;
      line-height:1.08;
      letter-spacing:.1px;
    }

    .hero p{
      margin:0;
      color:var(--muted);
      line-height:1.58;
      font-size:14px;
      max-width:92ch;
    }

    .searchCard{
      border:1px solid var(--line);
      border-radius:var(--rBig);
      background:var(--surface);
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:12px;
    }

    .toolbar{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
    }

    .control{
      width:100%;
      height:42px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--surface2);
      color:var(--text);
      padding:0 12px;
      outline:none;
      font-size:14px;
      transition:border-color var(--t), box-shadow var(--t), background var(--t);
    }

    .control:focus{
      border-color:rgba(249,115,22,.55);
      box-shadow:0 0 0 3px rgba(249,115,22,.18);
      background:#fff;
    }

    .clear-btn{
      height:42px;
      padding:0 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      font-weight:900;
      cursor:pointer;
      transition:transform var(--t), background var(--t), border-color var(--t);
      white-space:nowrap;
    }

    .clear-btn:hover{
      transform:translateY(-1px);
      background:var(--surface2);
      border-color:rgba(15,23,42,.14);
    }

    .workspace{
      display:grid;
      grid-template-columns:repeat(12, minmax(0,1fr));
      gap:14px;
    }

    .col{
      border:1px solid var(--line);
      border-radius:var(--rBig);
      background:var(--surface);
      box-shadow:var(--shadow);
      padding:14px;
      min-height:500px;
      min-width:0;
    }

    .col.specialty{ grid-column:span 2; }
    .col.subject{ grid-column:span 3; }
    .col.guideline{ grid-column:span 7; }

    .col-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:10px;
    }

    .col h2{
      margin:0;
      font-size:16px;
      color:#111827;
    }

    .count{
      font-size:12px;
      font-weight:800;
      color:var(--muted);
    }

    .stack{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .option-btn{
      width:100%;
      text-align:left;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      border-radius:14px;
      padding:12px;
      cursor:pointer;
      transition:transform var(--t), border-color var(--t), background var(--t), box-shadow var(--t);
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .option-btn:hover{
      transform:translateY(-1px);
      background:var(--surface2);
      border-color:rgba(15,23,42,.14);
      box-shadow:var(--shadow);
    }

    .option-btn.active{
      border-color:rgba(249,115,22,.42);
      background:
        linear-gradient(145deg, rgba(249,115,22,.12), rgba(249,115,22,.03) 45%, #fff 70%);
    }

    .option-btn strong{
      font-size:14px;
      line-height:1.35;
      color:#111827;
    }

    .option-btn span{
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
    }

    .guideline-list{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
    }

    .guideline-card{
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      background:#fff;
      box-shadow:var(--shadow);
    }

    .pdf-preview{
      background:#f8fafc;
      border-bottom:1px solid var(--line);
      padding:10px;
    }

    .pdf-sheet{
      position:relative;
      width:100%;
      max-width:240px;
      margin:0 auto;
      aspect-ratio:210 / 297;
      border:1px solid #e2e8f0;
      border-radius:10px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 6px 14px rgba(15,23,42,.08);
    }

    .pdf-preview iframe{
      border:0;
      width:100%;
      height:100%;
      display:block;
      background:#fff;
      position:absolute;
      inset:0;
    }

    .card-body{
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .card-body h3{
      margin:0;
      font-size:15px;
      line-height:1.4;
      color:#111827;
    }

    .meta{
      margin:0;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }

    .meta strong{
      color:#334155;
      font-weight:800;
    }

    .tags{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .tag{
      font-size:11px;
      border-radius:999px;
      padding:4px 8px;
      border:1px solid var(--line);
      background:var(--surface2);
      color:#475569;
      font-weight:800;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:100%;
      height:40px;
      padding:0 12px;
      border-radius:14px;
      border:1px solid var(--accent);
      background:var(--accent);
      color:#fff;
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      transition:filter var(--t), transform var(--t), box-shadow var(--t);
      box-shadow:0 10px 18px rgba(249,115,22,.18);
    }

    .btn:hover{
      filter:brightness(.95);
      transform:translateY(-1px);
      box-shadow:0 12px 22px rgba(249,115,22,.24);
    }

    .empty{
      border:1px dashed var(--line);
      border-radius:14px;
      padding:18px 12px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      background:var(--surface2);
    }

    .guideline-list .empty{
      grid-column:1 / -1;
    }

    @media (max-width:1080px){
      .workspace{ grid-template-columns:1fr; }
      .col.specialty, .col.subject, .col.guideline{
        grid-column:auto;
        min-height:auto;
      }
    }

    @media (max-width:900px){
      .guideline-list{ grid-template-columns:1fr; }
      .pdf-sheet{ max-width:220px; }
    }

    @media (max-width:720px){
      :root{ --containerPad:16px; }
      .topbar{ padding-top:14px; padding-bottom:14px; }
      .brand{ min-width:auto; }
      .headBtn{ height:36px; padding:0 12px; font-size:13px; }
      h1{ font-size:28px; }
      .hero{ padding:16px; }
      .searchCard{ padding:14px; }
      .toolbar{ grid-template-columns:1fr; }
      .clear-btn{ width:100%; }
    }
  </style>
</head>
<body>
  <div class="topbarWrap">
    <header class="topbar">
      <div class="brand" aria-label="UsoJaleco">
        <img alt="Logo UsoJaleco" src="https://raw.githubusercontent.com/arthurambrosi/usojaleco/0204905b333f11d1eec3c7c6667d17dbfb457774/Design%20sem%20nome%20(28).png" draggable="false" />
        <div class="brandName"><span>uso</span><b>jaleco</b></div>
      </div>
      <div class="headRight">
        <a class="headBtn" href="/">Voltar ao menu</a>
        <span class="headBtn headBtnPrimary">Diretrizes</span>
      </div>
    </header>
  </div>

  <main>
    <section class="hero">
      <span class="eyebrow">Diretrizes medicas</span>
      <h1>Buscador de Diretrizes e Protocolos</h1>
      <p>Estrutura por especialidade, assunto e diretrizes em PDF. O conteudo e carregado por <code>/diretrizes/data.json</code> para facilitar manutencao sem editar o HTML.</p>
    </section>

    <section class="searchCard">
      <div class="toolbar">
        <input id="searchInput" class="control" type="search" placeholder="Buscar por especialidade, assunto ou titulo da diretriz..." />
        <button id="clearBtn" class="clear-btn" type="button">Limpar busca</button>
      </div>
    </section>

    <section class="workspace">
      <article class="col specialty">
        <div class="col-head">
          <h2>Especialidades</h2>
          <span id="specialtyCount" class="count">0</span>
        </div>
        <div id="specialtyList" class="stack"></div>
      </article>

      <article class="col subject">
        <div class="col-head">
          <h2>Assuntos</h2>
          <span id="subjectCount" class="count">0</span>
        </div>
        <div id="subjectList" class="stack"></div>
      </article>

      <article class="col guideline">
        <div class="col-head">
          <h2>Diretrizes</h2>
          <span id="guidelineCount" class="count">0</span>
        </div>
        <div id="guidelineList" class="guideline-list"></div>
      </article>
    </section>
  </main>

  <script>
    (function () {
      var state = {
        catalog: [],
        search: "",
        selectedSpecialty: "",
        selectedSubject: ""
      };

      var dom = {
        searchInput: document.getElementById("searchInput"),
        clearBtn: document.getElementById("clearBtn"),
        specialtyList: document.getElementById("specialtyList"),
        subjectList: document.getElementById("subjectList"),
        guidelineList: document.getElementById("guidelineList"),
        specialtyCount: document.getElementById("specialtyCount"),
        subjectCount: document.getElementById("subjectCount"),
        guidelineCount: document.getElementById("guidelineCount")
      };

      function normalize(value) {
        return String(value || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim();
      }

      function getMatchingText(dirItem, specialtyName, subjectName) {
        var tags = Array.isArray(dirItem.tags) ? dirItem.tags.join(" ") : "";
        return normalize([
          specialtyName,
          subjectName,
          dirItem.titulo,
          dirItem.instituicao,
          dirItem.ano,
          tags
        ].join(" "));
      }

      function filterSpecialties(term) {
        if (!term) return state.catalog.slice();
        return state.catalog.filter(function (specialty) {
          if (normalize(specialty.especialidade).indexOf(term) !== -1) return true;
          return (specialty.assuntos || []).some(function (subject) {
            if (normalize(subject.nome_assunto).indexOf(term) !== -1) return true;
            return (subject.diretrizes || []).some(function (dirItem) {
              return getMatchingText(dirItem, specialty.especialidade, subject.nome_assunto).indexOf(term) !== -1;
            });
          });
        });
      }

      function findSpecialty(name, inList) {
        return (inList || state.catalog).find(function (item) { return item.especialidade === name; }) || null;
      }

      function filterSubjects(specialty, term) {
        if (!specialty) return [];
        var subjects = Array.isArray(specialty.assuntos) ? specialty.assuntos : [];
        if (!term) return subjects.slice();
        return subjects.filter(function (subject) {
          if (normalize(subject.nome_assunto).indexOf(term) !== -1) return true;
          return (subject.diretrizes || []).some(function (dirItem) {
            return getMatchingText(dirItem, specialty.especialidade, subject.nome_assunto).indexOf(term) !== -1;
          });
        });
      }

      function findSubject(specialty, subjectName, filteredSubjects) {
        if (!specialty) return null;
        var source = filteredSubjects || specialty.assuntos || [];
        return source.find(function (item) { return item.nome_assunto === subjectName; }) || null;
      }

      function filterGuidelines(specialtyName, subject, term) {
        if (!subject) return [];
        var list = Array.isArray(subject.diretrizes) ? subject.diretrizes : [];
        if (!term) return list.slice();
        return list.filter(function (dirItem) {
          return getMatchingText(dirItem, specialtyName, subject.nome_assunto).indexOf(term) !== -1;
        });
      }

      function countMatchesInSpecialty(specialty, term) {
        if (!term) {
          return (specialty.assuntos || []).reduce(function (acc, subject) {
            return acc + ((subject.diretrizes || []).length);
          }, 0);
        }

        var count = 0;
        (specialty.assuntos || []).forEach(function (subject) {
          (subject.diretrizes || []).forEach(function (dirItem) {
            if (getMatchingText(dirItem, specialty.especialidade, subject.nome_assunto).indexOf(term) !== -1) {
              count += 1;
            }
          });
        });
        return count;
      }

      function buildPreviewUrl(pdfUrl) {
        if (!pdfUrl) return "";
        return "https://docs.google.com/gview?embedded=1&url=" + encodeURIComponent(pdfUrl);
      }

      function ensureSelection(filteredSpecialties, filteredSubjects) {
        if (!filteredSpecialties.length) {
          state.selectedSpecialty = "";
          state.selectedSubject = "";
          return;
        }

        if (!findSpecialty(state.selectedSpecialty, filteredSpecialties)) {
          state.selectedSpecialty = filteredSpecialties[0].especialidade;
        }

        if (!filteredSubjects.length) {
          state.selectedSubject = "";
          return;
        }

        if (!filteredSubjects.find(function (item) { return item.nome_assunto === state.selectedSubject; })) {
          state.selectedSubject = filteredSubjects[0].nome_assunto;
        }
      }

      function renderSpecialties(specialties, term) {
        dom.specialtyList.innerHTML = "";
        dom.specialtyCount.textContent = String(specialties.length);

        if (!specialties.length) {
          dom.specialtyList.innerHTML = '<div class="empty">Nenhuma especialidade encontrada.</div>';
          return;
        }

        specialties.forEach(function (specialty) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn" + (state.selectedSpecialty === specialty.especialidade ? " active" : "");
          btn.innerHTML =
            "<strong>" + specialty.especialidade + "</strong>" +
            "<span>" + (specialty.assuntos || []).length + " assuntos - " + countMatchesInSpecialty(specialty, term) + " diretrizes</span>";
          btn.addEventListener("click", function () {
            state.selectedSpecialty = specialty.especialidade;
            state.selectedSubject = "";
            render();
          });
          dom.specialtyList.appendChild(btn);
        });
      }

      function renderSubjects(subjects) {
        dom.subjectList.innerHTML = "";
        dom.subjectCount.textContent = String(subjects.length);

        if (!subjects.length) {
          dom.subjectList.innerHTML = '<div class="empty">Nenhum assunto encontrado para os filtros atuais.</div>';
          return;
        }

        subjects.forEach(function (subject) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn" + (state.selectedSubject === subject.nome_assunto ? " active" : "");
          btn.innerHTML =
            "<strong>" + subject.nome_assunto + "</strong>" +
            "<span>" + (subject.diretrizes || []).length + " diretrizes</span>";
          btn.addEventListener("click", function () {
            state.selectedSubject = subject.nome_assunto;
            render();
          });
          dom.subjectList.appendChild(btn);
        });
      }

      function renderGuidelines(guidelines, specialtyName, subjectName) {
        dom.guidelineList.innerHTML = "";
        dom.guidelineCount.textContent = String(guidelines.length);

        if (!guidelines.length) {
          dom.guidelineList.innerHTML = '<div class="empty">Nenhuma diretriz encontrada para a selecao atual.</div>';
          return;
        }

        guidelines.forEach(function (dirItem) {
          var card = document.createElement("article");
          card.className = "guideline-card";

          var previewUrl = buildPreviewUrl(dirItem.link_pdf);
          var previewHtml = previewUrl
            ? '<div class="pdf-preview"><div class="pdf-sheet"><iframe loading="lazy" src="' + previewUrl + '" title="Preview do PDF"></iframe></div></div>'
            : '<div class="pdf-preview"><div class="pdf-sheet"></div></div>';

          var tags = Array.isArray(dirItem.tags) ? dirItem.tags : [];
          var tagsHtml = tags.map(function (tag) {
            return '<span class="tag">' + tag + "</span>";
          }).join("");

          card.innerHTML =
            previewHtml +
            '<div class="card-body">' +
              "<h3>" + (dirItem.titulo || "Diretriz sem titulo") + "</h3>" +
              '<p class="meta"><strong>Instituicao:</strong> ' + (dirItem.instituicao || "-") + "</p>" +
              '<p class="meta"><strong>Ano:</strong> ' + (dirItem.ano || "-") + "</p>" +
              '<p class="meta"><strong>Especialidade:</strong> ' + (specialtyName || "-") + " - <strong>Assunto:</strong> " + (subjectName || "-") + "</p>" +
              (tagsHtml ? '<div class="tags">' + tagsHtml + "</div>" : "") +
              '<a class="btn" href="' + (dirItem.link_pdf || "#") + '" target="_blank" rel="noopener">Abrir PDF</a>' +
            "</div>";

          dom.guidelineList.appendChild(card);
        });
      }

      function render() {
        var term = normalize(state.search);
        var specialties = filterSpecialties(term);
        var selectedSpecialtyObj = findSpecialty(state.selectedSpecialty, specialties);
        var subjects = filterSubjects(selectedSpecialtyObj, term);

        ensureSelection(specialties, subjects);

        selectedSpecialtyObj = findSpecialty(state.selectedSpecialty, specialties);
        subjects = filterSubjects(selectedSpecialtyObj, term);
        var selectedSubjectObj = findSubject(selectedSpecialtyObj, state.selectedSubject, subjects);
        var guidelines = filterGuidelines(
          selectedSpecialtyObj ? selectedSpecialtyObj.especialidade : "",
          selectedSubjectObj,
          term
        );

        renderSpecialties(specialties, term);
        renderSubjects(subjects);
        renderGuidelines(
          guidelines,
          selectedSpecialtyObj ? selectedSpecialtyObj.especialidade : "",
          selectedSubjectObj ? selectedSubjectObj.nome_assunto : ""
        );
      }

      function attachEvents() {
        dom.searchInput.addEventListener("input", function () {
          state.search = dom.searchInput.value;
          render();
        });

        dom.clearBtn.addEventListener("click", function () {
          state.search = "";
          dom.searchInput.value = "";
          render();
        });
      }

      fetch("./data.json?v=" + Date.now(), { cache: "no-store" })
        .then(function (res) { return res.ok ? res.json() : []; })
        .then(function (data) {
          state.catalog = Array.isArray(data) ? data : [];
          if (state.catalog.length) {
            state.selectedSpecialty = state.catalog[0].especialidade || "";
            var firstSubject = (state.catalog[0].assuntos || [])[0];
            state.selectedSubject = firstSubject ? firstSubject.nome_assunto : "";
          }
          attachEvents();
          render();
        })
        .catch(function () {
          dom.specialtyList.innerHTML = '<div class="empty">Nao foi possivel carregar /diretrizes/data.json.</div>';
          dom.subjectList.innerHTML = '<div class="empty">-</div>';
