<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UsoJaleco | Eventos Medicos</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/arthurambrosi/usojaleco/0204905b333f11d1eec3c7c6667d17dbfb457774/Design%20sem%20nome%20(28).png">
  <script defer src="/analytics-config.js"></script>
  <script defer src="/analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff;
      --surface:#ffffff;
      --surface2:#f8fafc;
      --text:#0f172a;
      --muted:#6b7280;
      --line:#e9eef5;
      --accent:#f97316;
      --shadow:0 10px 22px rgba(17,24,39,.08);
      --shadow2:0 14px 28px rgba(17,24,39,.10);
      --rBig:24px;
      --rMid:18px;
      --rSm:14px;
      --containerMax:1340px;
      --containerPad:24px;
      --t:.18s ease;
    }

    *{ box-sizing:border-box; }
    html,body{ min-height:100%; }

    body{
      margin:0;
      font-family: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 12% 10%, rgba(249,115,22,.10), transparent 60%),
        radial-gradient(1000px 580px at 85% 18%, rgba(15,23,42,.06), transparent 62%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
      background-attachment: fixed, fixed, fixed;
    }

    a{ color:inherit; text-decoration:none; }
    button,input,select{ font:inherit; }

    .topbarWrap{
      background:#fff;
      box-shadow:0 10px 22px rgba(17,24,39,.10);
      position:sticky;
      top:0;
      z-index:40;
    }

    .topbar{
      max-width:var(--containerMax);
      margin:0 auto;
      padding:16px var(--containerPad);
      display:flex;
      align-items:center;
      gap:16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:190px;
      user-select:none;
    }

    .brand img{
      height:28px;
      width:auto;
      display:block;
      user-select:none;
      pointer-events:none;
      -webkit-user-drag:none;
    }

    .brandName{
      display:flex;
      align-items:baseline;
      gap:0;
      font-family: Outfit, Manrope, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size:18px;
      font-weight:400;
      letter-spacing:-.01em;
      color:#475569;
      user-select:none;
      pointer-events:none;
    }

    .brandName b{
      font-weight:800;
      color:#334155;
    }

    .headRight{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .headBtn{
      height:38px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid #e7ebf2;
      background:#fff;
      color:#334155;
      font-weight:900;
      cursor:pointer;
      transition:background var(--t), filter var(--t), transform var(--t);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      line-height:1;
      white-space:nowrap;
    }

    .headBtn:hover{
      background:#f8fafc;
      transform:translateY(-1px);
    }

    .headBtnPrimary{
      background:var(--accent);
      border-color:var(--accent);
      color:#fff;
    }

    .headBtnPrimary:hover{
      background:var(--accent);
      border-color:var(--accent);
      filter:brightness(.94);
    }

    main{
      max-width:var(--containerMax);
      margin:0 auto;
      padding:16px var(--containerPad) 42px;
    }

    .hero{
      border:1px solid var(--line);
      border-radius:var(--rBig);
      background:var(--surface);
      box-shadow:var(--shadow);
      padding:20px;
      margin-bottom:14px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      border:1px solid rgba(249,115,22,.28);
      background:rgba(249,115,22,.10);
      color:#c2410c;
      padding:5px 11px;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:10px;
    }

    h1{
      margin:0 0 8px;
      font-size:34px;
      line-height:1.08;
      letter-spacing:.1px;
    }

    .hero p{
      margin:0;
      color:var(--muted);
      line-height:1.58;
      font-size:14px;
      max-width:90ch;
    }

    .filtersCard{
      border:1px solid var(--line);
      border-radius:var(--rBig);
      background:var(--surface);
      box-shadow:var(--shadow);
      padding:16px;
    }

    .controls{
      display:grid;
      grid-template-columns:1.35fr repeat(4, minmax(0,1fr)) auto;
      gap:10px;
      margin-bottom:14px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }

    .field label{
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.15px;
    }

    .control{
      width:100%;
      height:42px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--surface2);
      color:var(--text);
      padding:0 12px;
      outline:none;
      font-size:14px;
      transition:border-color var(--t), box-shadow var(--t), background var(--t);
    }

    .control:focus{
      border-color:rgba(249,115,22,.55);
      box-shadow:0 0 0 3px rgba(249,115,22,.18);
      background:#fff;
    }

    .clear-btn{
      align-self:end;
      height:42px;
      padding:0 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      font-weight:900;
      cursor:pointer;
      transition:transform var(--t), background var(--t), border-color var(--t);
      white-space:nowrap;
    }

    .clear-btn:hover{
      transform:translateY(-1px);
      background:var(--surface2);
      border-color:rgba(15,23,42,.14);
    }

    .summary{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin:8px 0 14px;
      color:var(--muted);
      font-size:13px;
      flex-wrap:wrap;
    }

    .summary strong{ color:var(--text); }

    .cards{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .area-block{
      border:1px solid var(--line);
      border-radius:var(--rMid);
      background:
        linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.97)),
        linear-gradient(130deg, var(--area-c1, #0ea5e9), var(--area-c2, #2563eb));
      box-shadow:var(--shadow);
      padding:12px;
    }

    .area-head{
      width:100%;
      text-align:left;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      font:inherit;
      color:inherit;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,.42);
      border-radius:12px;
      background:
        linear-gradient(115deg, rgba(255,255,255,.82), rgba(255,255,255,.62)),
        linear-gradient(130deg, var(--area-c1, #0ea5e9), var(--area-c2, #2563eb));
    }

    .area-head:hover{
      filter:brightness(.985);
    }

    .area-head:focus-visible{
      outline:3px solid rgba(249,115,22,.36);
      outline-offset:2px;
    }

    .area-title{
      margin:0;
      font-size:18px;
      line-height:1.2;
      color:#0f172a;
      font-weight:900;
    }

    .area-head-meta{
      margin-left:auto;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .area-count{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.58);
      padding:4px 10px;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.05em;
      color:#334155;
      background:rgba(255,255,255,.72);
      white-space:nowrap;
    }

    .area-chevron{
      width:28px;
      height:28px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.58);
      background:rgba(255,255,255,.72);
      color:#1e293b;
      font-size:14px;
      line-height:1;
      transition:transform var(--t);
    }

    .area-block.is-collapsed .area-head{
      margin-bottom:0;
    }

    .area-block.is-collapsed .area-chevron{
      transform:rotate(-90deg);
    }

    .area-grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:12px;
    }

    .area-grid[hidden]{
      display:none !important;
    }

    .card{
      border:1px solid var(--line);
      border-radius:var(--rMid);
      background:var(--surface);
      box-shadow:var(--shadow);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:346px;
    }

    .card.is-featured{
      border-color:rgba(249,115,22,.42);
      background:
        linear-gradient(145deg, rgba(249,115,22,.12), rgba(249,115,22,.03) 45%, #fff 70%);
    }

    .badge-row{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:4px 10px;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.06em;
      border:1px solid var(--line);
      background:#fff;
      color:#475569;
    }

    .badge-featured{
      border-color:rgba(249,115,22,.4);
      background:rgba(249,115,22,.14);
      color:#c2410c;
    }

    .card h3{
      margin:0;
      font-size:18px;
      line-height:1.3;
      min-height:54px;
      color:#111827;
    }

    .thumb{
      position:relative;
      width:100%;
      aspect-ratio:16 / 9;
      border-radius:12px;
      overflow:hidden;
      border:1px solid var(--line);
      background:linear-gradient(145deg, var(--area-c1, #0ea5e9), var(--area-c2, #2563eb));
      box-shadow:0 5px 14px rgba(15,23,42,.06);
    }

    .thumb::before{
      content:"";
      position:absolute;
      inset:-26% -12%;
      background:
        radial-gradient(circle at 24% 16%, rgba(255,255,255,.28), rgba(255,255,255,0) 50%),
        radial-gradient(circle at 80% 88%, rgba(255,255,255,.22), rgba(255,255,255,0) 42%);
      pointer-events:none;
    }

    .thumb-fallback{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 50% 50%, rgba(15,23,42,.14) 0%, rgba(15,23,42,.48) 68%, rgba(15,23,42,.78) 100%),
        linear-gradient(145deg, var(--area-c1, #0ea5e9), var(--area-c2, #2563eb));
    }

    .thumb-logo-wrap{
      width:min(44%, 132px);
      aspect-ratio:1;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:linear-gradient(160deg, var(--area-c3, #1e3a8a), rgba(2,6,23,.94));
      border:1px solid rgba(255,255,255,.34);
      box-shadow:0 12px 24px rgba(2,6,23,.45);
      backdrop-filter: blur(1px);
    }

    .thumb-logo{
      width:72%;
      object-fit:contain;
      filter:drop-shadow(0 3px 8px rgba(0,0,0,.35));
    }

    .meta{
      margin:0;
      display:flex;
      flex-direction:column;
      gap:6px;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }

    .meta strong{
      color:#334155;
      font-weight:800;
    }

    .card .cta{ margin-top:auto; }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:100%;
      height:40px;
      padding:0 12px;
      border-radius:14px;
      border:1px solid var(--accent);
      background:var(--accent);
      color:#fff;
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      transition:filter var(--t), transform var(--t), box-shadow var(--t);
      box-shadow:0 10px 18px rgba(249,115,22,.18);
    }

    .btn:hover{
      filter:brightness(.95);
      transform:translateY(-1px);
      box-shadow:0 12px 22px rgba(249,115,22,.24);
    }

    .empty{
      border:1px dashed var(--line);
      border-radius:var(--rMid);
      padding:26px 16px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
      background:var(--surface2);
      grid-column:1 / -1;
    }

    @media (max-width:1080px){
      .controls{ grid-template-columns:repeat(2, minmax(0,1fr)); }
      .clear-btn{ width:100%; }
      .area-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    }

    @media (max-width:720px){
      :root{ --containerPad:16px; }
      .topbar{ padding-top:14px; padding-bottom:14px; }
      .brand{ min-width:auto; }
      .headBtn{ height:36px; padding:0 12px; font-size:13px; }
      h1{ font-size:28px; }
      .hero{ padding:16px; }
      .filtersCard{ padding:14px; }
      .controls{ grid-template-columns:1fr; }
      .area-grid{ grid-template-columns:1fr; }
      .area-head{ flex-direction:column; align-items:flex-start; }
      .area-head-meta{ width:100%; justify-content:space-between; margin-left:0; }
      .card h3{ min-height:auto; }
    }
  </style>
</head>
<body>
  <div class="topbarWrap">
    <header class="topbar">
      <div class="brand" aria-label="UsoJaleco">
        <img alt="Logo UsoJaleco" src="https://raw.githubusercontent.com/arthurambrosi/usojaleco/0204905b333f11d1eec3c7c6667d17dbfb457774/Design%20sem%20nome%20(28).png" draggable="false" />
        <div class="brandName"><span>uso</span><b>jaleco</b></div>
      </div>
      <div class="headRight">
        <a class="headBtn" href="/">Voltar ao menu</a>
        <span class="headBtn headBtnPrimary">Eventos</span>
      </div>
    </header>
  </div>

  <main>
    <section class="hero">
      <span class="eyebrow">Eventos medicos</span>
      <h1>Congressos, Simpósios, Jornadas e Cursos</h1>
      <p>Pesquise e filtre eventos por tipo, modalidade, localização e área</p>
    </section>

    <section class="filtersCard">
      <div class="controls">
        <div class="field">
          <label for="searchInput">Busca por nome</label>
          <input id="searchInput" class="control" type="search" placeholder="Ex.: cardiologia, UTI, pediatria..." />
        </div>
        <div class="field">
          <label for="typeFilter">Tipo</label>
          <select id="typeFilter" class="control">
            <option value="">Todos</option>
            <option value="congresso">Congresso</option>
            <option value="simposio">Simposio</option>
            <option value="jornada">Jornada</option>
            <option value="curso">Curso</option>
          </select>
        </div>
        <div class="field">
          <label for="modeFilter">Modalidade</label>
          <select id="modeFilter" class="control">
            <option value="">Todas</option>
            <option value="presencial">Presencial</option>
            <option value="online">Online</option>
          </select>
        </div>
        <div class="field">
          <label for="locationFilter">Localizacao</label>
          <select id="locationFilter" class="control">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="field">
          <label for="areaFilter">Especialidade / area</label>
          <select id="areaFilter" class="control">
            <option value="">Todas</option>
          </select>
        </div>
        <button id="clearBtn" class="clear-btn" type="button">Limpar filtros</button>
      </div>

      <div class="summary">
        <div><strong id="resultCount">0</strong> eventos encontrados</div>
        <div>Ordenacao padrao: data mais proxima primeiro</div>
      </div>

      <section id="cards" class="cards" aria-live="polite"></section>
    </section>
  </main>

  <script>
    (function () {
      var state = {
        events: [],
        filters: {
          q: "",
          tipo: "",
          modalidade: "",
          localizacao: "",
          area: ""
        },
        collapsedAreas: {}
      };
      var LOGO_SRC = "https://raw.githubusercontent.com/arthurambrosi/usojaleco/0204905b333f11d1eec3c7c6667d17dbfb457774/Design%20sem%20nome%20(28).png";

      var dom = {
        searchInput: document.getElementById("searchInput"),
        typeFilter: document.getElementById("typeFilter"),
        modeFilter: document.getElementById("modeFilter"),
        locationFilter: document.getElementById("locationFilter"),
        areaFilter: document.getElementById("areaFilter"),
        clearBtn: document.getElementById("clearBtn"),
        cards: document.getElementById("cards"),
        resultCount: document.getElementById("resultCount")
      };

      function normalize(value) {
        return String(value || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim();
      }

      function formatLabel(word) {
        if (!word) return "-";
        return word.charAt(0).toUpperCase() + word.slice(1);
      }

      function parseDate(dateStr) {
        if (!dateStr) return null;
        var parts = String(dateStr).split("-");
        if (parts.length !== 3) return null;
        var year = Number(parts[0]);
        var month = Number(parts[1]) - 1;
        var day = Number(parts[2]);
        var date = new Date(year, month, day);
        if (Number.isNaN(date.getTime())) return null;
        return date;
      }

      function formatDate(dateStr) {
        var date = parseDate(dateStr);
        if (!date) return "-";
        return date.toLocaleDateString("pt-BR");
      }

      function eventIsOnline(eventItem) {
        if (!eventItem || typeof eventItem !== "object") return false;
        if (typeof eventItem.online === "boolean") return eventItem.online;
        return String(eventItem.modalidade || "").toLowerCase() === "online";
      }

      function eventModalidade(eventItem) {
        return eventIsOnline(eventItem) ? "online" : "presencial";
      }

      function hashString(value) {
        var text = String(value || "");
        var hash = 0;
        for (var i = 0; i < text.length; i += 1) {
          hash = (hash * 31 + text.charCodeAt(i)) % 360;
        }
        return hash;
      }

      function areaTheme(areaName) {
        var key = normalize(areaName);
        var palette = {
          "cardiologia": ["#0284c7", "#1d4ed8", "#132a7a"],
          "dermatologia": ["#ea580c", "#c2410c", "#7c2d12"],
          "endocrinologia e metabologia": ["#0ea5a5", "#0f766e", "#134e4a"],
          "ginecologia e obstetricia": ["#be185d", "#9d174d", "#701a3b"],
          "infectologia": ["#16a34a", "#15803d", "#14532d"],
          "neurologia": ["#4f46e5", "#4338ca", "#312e81"],
          "oftalmologia": ["#0891b2", "#0e7490", "#164e63"],
          "oncologia": ["#dc2626", "#b91c1c", "#7f1d1d"],
          "ortopedia e traumatologia": ["#7c3aed", "#6d28d9", "#4c1d95"],
          "pediatria": ["#0d9488", "#0f766e", "#134e4a"],
          "psiquiatria": ["#9333ea", "#7e22ce", "#581c87"],
          "radiologia e diagnostico por imagem": ["#0369a1", "#075985", "#0c4a6e"],
          "reumatologia": ["#2563eb", "#1d4ed8", "#1e3a8a"],
          "urologia": ["#0f766e", "#0f766e", "#115e59"]
        };

        if (palette[key]) {
          return {
            c1: palette[key][0],
            c2: palette[key][1],
            c3: palette[key][2]
          };
        }

        var hue = hashString(key || "eventos");
        return {
          c1: "hsl(" + hue + " 84% 58%)",
          c2: "hsl(" + ((hue + 34) % 360) + " 76% 46%)",
          c3: "hsl(" + ((hue + 8) % 360) + " 30%)"
        };
      }

      function eventLocation(eventItem) {
        if (eventIsOnline(eventItem)) {
          return "Online";
        }
        if (eventItem.internacional) {
          return eventItem.cidade ? eventItem.cidade + " - Internacional" : "Internacional";
        }
        var city = eventItem.cidade || "";
        var uf = (eventItem.uf || "").toUpperCase();
        if (city && uf) return city + "/" + uf;
        if (uf) return uf;
        if (city) return city;
        return "Presencial";
      }

      function locationFilterKey(eventItem) {
        if (eventIsOnline(eventItem)) return "";
        if (eventItem.internacional) return "internacional";
        return (eventItem.uf || "").toUpperCase();
      }

      function createMetaLine(label, value) {
        var span = document.createElement("span");
        var strong = document.createElement("strong");
        strong.textContent = label + ": ";
        span.appendChild(strong);
        span.appendChild(document.createTextNode(value));
        return span;
      }

      function buildThumbElement(theme) {
        var wrap = document.createElement("div");
        wrap.className = "thumb";
        wrap.style.setProperty("--area-c1", theme.c1);
        wrap.style.setProperty("--area-c2", theme.c2);
        wrap.style.setProperty("--area-c3", theme.c3);

        var fallback = document.createElement("div");
        fallback.className = "thumb-fallback";

        var logoWrap = document.createElement("div");
        logoWrap.className = "thumb-logo-wrap";

        var logo = document.createElement("img");
        logo.className = "thumb-logo";
        logo.alt = "Logo UsoJaleco";
        logo.loading = "lazy";
        logo.src = LOGO_SRC;

        logoWrap.appendChild(logo);
        fallback.appendChild(logoWrap);
        wrap.appendChild(fallback);

        return wrap;
      }

      function sortByNearestDate(list) {
        var today = new Date();
        today.setHours(0, 0, 0, 0);

        return list.slice().sort(function (a, b) {
          var da = parseDate(a.data_inicio);
          var db = parseDate(b.data_inicio);
          if (!da && !db) return 0;
          if (!da) return 1;
          if (!db) return -1;

          var aIsPast = da < today;
          var bIsPast = db < today;

          if (aIsPast !== bIsPast) {
            return aIsPast ? 1 : -1;
          }

          return da.getTime() - db.getTime();
        });
      }

      function buildDynamicFilters() {
        var locationSet = {};
        var areaSet = {};

        state.events.forEach(function (item) {
          if (eventIsOnline(item)) {
            return;
          }
          if (item.internacional) {
            locationSet.internacional = "Internacional";
          } else if (item.uf) {
            var uf = String(item.uf).toUpperCase();
            locationSet[uf] = uf;
          }

          if (item.area) {
            areaSet[item.area] = item.area;
          }
        });

        Object.keys(locationSet).sort().forEach(function (key) {
          if (key === "internacional") return;
          var option = document.createElement("option");
          option.value = key;
          option.textContent = locationSet[key];
          dom.locationFilter.appendChild(option);
        });

        if (locationSet.internacional) {
          var intlOption = document.createElement("option");
          intlOption.value = "internacional";
          intlOption.textContent = "Internacional";
          dom.locationFilter.appendChild(intlOption);
        }

        Object.keys(areaSet).sort().forEach(function (key) {
          var option = document.createElement("option");
          option.value = key;
          option.textContent = areaSet[key];
          dom.areaFilter.appendChild(option);
        });
      }

      function filterEvents() {
        var q = normalize(state.filters.q);
        var tipo = normalize(state.filters.tipo);
        var modalidade = normalize(state.filters.modalidade);
        var localizacao = normalize(state.filters.localizacao);
        var area = normalize(state.filters.area);

        var filtered = state.events.filter(function (item) {
          if (q && normalize(item.nome).indexOf(q) === -1) return false;
          if (tipo && normalize(item.tipo) !== tipo) return false;
          if (modalidade && normalize(eventModalidade(item)) !== modalidade) return false;
          if (localizacao && normalize(locationFilterKey(item)) !== localizacao) return false;
          if (area && normalize(item.area) !== area) return false;
          return true;
        });

        return sortByNearestDate(filtered);
      }

      function groupByArea(list) {
        var groups = {};

        list.forEach(function (item) {
          var areaName = (item.area || "").trim() || "Sem area definida";
          if (!groups[areaName]) {
            groups[areaName] = [];
          }
          groups[areaName].push(item);
        });

        return Object.keys(groups)
          .sort(function (a, b) {
            return a.localeCompare(b, "pt-BR");
          })
          .map(function (areaName) {
            return {
              area: areaName,
              items: groups[areaName]
            };
          });
      }

      function areaKey(areaName) {
        var cleaned = normalize(areaName)
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
        return cleaned || "sem-area-definida";
      }

      function renderCards(list) {
        dom.cards.innerHTML = "";
        dom.resultCount.textContent = String(list.length);

        if (!list.length) {
          var empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Nenhum evento encontrado com os filtros atuais.";
          dom.cards.appendChild(empty);
          return;
        }

        groupByArea(list).forEach(function (group, groupIndex) {
          var theme = areaTheme(group.area);
          var key = areaKey(group.area);
          var isCollapsed = Boolean(state.collapsedAreas[key]);
          var areaGridId = "area-grid-" + key + "-" + String(groupIndex);
          var areaBlock = document.createElement("section");
          areaBlock.className = "area-block";
          areaBlock.style.setProperty("--area-c1", theme.c1);
          areaBlock.style.setProperty("--area-c2", theme.c2);
          areaBlock.style.setProperty("--area-c3", theme.c3);
          if (isCollapsed) {
            areaBlock.classList.add("is-collapsed");
          }

          var areaHead = document.createElement("button");
          areaHead.className = "area-head";
          areaHead.type = "button";
          areaHead.setAttribute("aria-expanded", String(!isCollapsed));
          areaHead.setAttribute("aria-controls", areaGridId);

          var areaTitle = document.createElement("span");
          areaTitle.className = "area-title";
          areaTitle.textContent = group.area;

          var areaHeadMeta = document.createElement("span");
          areaHeadMeta.className = "area-head-meta";

          var areaCount = document.createElement("span");
          areaCount.className = "area-count";
          areaCount.textContent = group.items.length + (group.items.length === 1 ? " evento" : " eventos");

          var areaChevron = document.createElement("span");
          areaChevron.className = "area-chevron";
          areaChevron.setAttribute("aria-hidden", "true");
          areaChevron.textContent = "▾";

          areaHeadMeta.appendChild(areaCount);
          areaHeadMeta.appendChild(areaChevron);
          areaHead.appendChild(areaTitle);
          areaHead.appendChild(areaHeadMeta);

          var areaGrid = document.createElement("div");
          areaGrid.className = "area-grid";
          areaGrid.id = areaGridId;
          areaGrid.hidden = isCollapsed;

          areaHead.addEventListener("click", function () {
            var currentlyCollapsed = Boolean(state.collapsedAreas[key]);
            var nextCollapsed = !currentlyCollapsed;
            state.collapsedAreas[key] = nextCollapsed;
            areaBlock.classList.toggle("is-collapsed", nextCollapsed);
            areaGrid.hidden = nextCollapsed;
            areaHead.setAttribute("aria-expanded", String(!nextCollapsed));
          });

          group.items.forEach(function (item) {
            var card = document.createElement("article");
            card.className = "card" + (item.destaque ? " is-featured" : "");

            var badgeRow = document.createElement("div");
            badgeRow.className = "badge-row";

            if (item.destaque) {
              var featuredBadge = document.createElement("span");
              featuredBadge.className = "badge badge-featured";
              featuredBadge.textContent = "Destaque";
              badgeRow.appendChild(featuredBadge);
            }

            var typeBadge = document.createElement("span");
            typeBadge.className = "badge";
            typeBadge.textContent = formatLabel(item.tipo || "evento");
            badgeRow.appendChild(typeBadge);

            var title = document.createElement("h3");
            title.textContent = item.nome || "Evento sem nome";

            var meta = document.createElement("p");
            meta.className = "meta";
            meta.appendChild(createMetaLine("Data", formatDate(item.data_inicio)));
            meta.appendChild(createMetaLine("Local", eventLocation(item)));
            meta.appendChild(createMetaLine("Modalidade", formatLabel(eventModalidade(item))));
            meta.appendChild(createMetaLine("Area", item.area || "Nao informada"));

            var cta = document.createElement("div");
            cta.className = "cta";

            var link = document.createElement("a");
            link.className = "btn";
            link.href = item.link || "#";
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = "Saiba mais / Ver evento";

            cta.appendChild(link);

            card.appendChild(badgeRow);
            card.appendChild(buildThumbElement(theme));
            card.appendChild(title);
            card.appendChild(meta);
            card.appendChild(cta);

            areaGrid.appendChild(card);
          });

          areaBlock.appendChild(areaHead);
          areaBlock.appendChild(areaGrid);
          dom.cards.appendChild(areaBlock);
        });
      }

      function applyFiltersAndRender() {
        renderCards(filterEvents());
      }

      function attachEvents() {
        dom.searchInput.addEventListener("input", function () {
          state.filters.q = dom.searchInput.value;
          applyFiltersAndRender();
        });

        dom.typeFilter.addEventListener("change", function () {
          state.filters.tipo = dom.typeFilter.value;
          applyFiltersAndRender();
        });

        dom.modeFilter.addEventListener("change", function () {
          state.filters.modalidade = dom.modeFilter.value;
          applyFiltersAndRender();
        });

        dom.locationFilter.addEventListener("change", function () {
          state.filters.localizacao = dom.locationFilter.value;
          applyFiltersAndRender();
        });

        dom.areaFilter.addEventListener("change", function () {
          state.filters.area = dom.areaFilter.value;
          applyFiltersAndRender();
        });

        dom.clearBtn.addEventListener("click", function () {
          state.filters = { q: "", tipo: "", modalidade: "", localizacao: "", area: "" };
          dom.searchInput.value = "";
          dom.typeFilter.value = "";
          dom.modeFilter.value = "";
          dom.locationFilter.value = "";
          dom.areaFilter.value = "";
          applyFiltersAndRender();
        });
      }

      function validateEvent(item) {
        if (!item || typeof item !== "object") return false;
        if (!item.id || !item.nome || !item.tipo || !item.data_inicio || !item.link) return false;
        if (typeof item.online !== "boolean" && !item.modalidade) return false;
        return true;
      }

      fetch("./data.json?v=" + Date.now(), { cache: "no-store" })
        .then(function (res) { return res.ok ? res.json() : []; })
        .then(function (data) {
          var list = Array.isArray(data) ? data : [];
          state.events = list.filter(validateEvent);
          buildDynamicFilters();
          attachEvents();
          applyFiltersAndRender();
        })
        .catch(function () {
          dom.cards.innerHTML = '<div class="empty">Nao foi possivel carregar /eventos/data.json.</div>';
        });
    })();
  </script>
</body>
</html>
